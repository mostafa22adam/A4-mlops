name: Assignment 5 Multi-Job Pipeline

on:
  push:
    branches:
      - assignment5
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      MODEL_MODE: ${{ vars.MODEL_MODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull data with DVC
        run: |
          dvc pull || echo "DVC pull skipped: remote not accessible on this runner"

      - name: Train and log to MLflow
        run: |
          python train.py

      - name: Show generated files
        run: |
          ls -R
          echo "----- model_info.txt -----"
          cat model_info.txt

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            model_info.txt
            mlflow.db
            mlruns

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts into workspace root
        uses: actions/download-artifact@v4
        with:
          name: pipeline-artifacts
          path: .

      - name: Show downloaded files
        run: |
          pwd
          ls -R
          echo "----- model_info.txt -----"
          cat model_info.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check threshold from MLflow
        run: |
          python check_threshold.py

      - name: Mock Docker build
        run: |
          echo "Building Docker image for Run ID: $(cat model_info.txt)"

      - name: Build Dockerfile with RUN_ID
        run: |
          docker build --build-arg RUN_ID=$(cat model_info.txt) -t assignment5-app .
apiVersion: v1

kind: Service

metadata:
  name: frontend-service

spec:
  type: NodePort

  selector:
    app: web

ports:
  - name: web
    protocol: TCP
    port: 80 # port the service listens on (INTERNAL Cluster Port)
    targetPort: 8501 # port the Streamlit container is running on (POD/CONTAINER Port)
    nodePort: 30085